name: fetch-assets
on:
  push:
    branches: [assets-fetch]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          i=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            name="${line%% *}"; url="${line#* }"
            curl -sSL --fail -o "out/$name" "$url" && echo "ok $name" || echo "fail $name"
          done < urls.txt
          ls -la out
      - name: Commit
        run: |
          git config user.name "assets-bot"; git config user.email "assets-bot@users.noreply.github.com"
          git add out; git commit -m "fetched assets" || true
          git push
