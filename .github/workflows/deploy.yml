name: Deploy Mini App to GitHub Pages

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # R44: src/ собирается в dist/ (node build.mjs). dist/ лежит в репозитории: на сайт идёт ровно то,
      # что проверено локально, а файлы прошлых сборок остаются для тех, у кого открыта старая версия
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and check dist
        run: |
          npm ci --no-audit --no-fund
          node build.mjs
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo "dist/ не совпадает с src/: запустите node build.mjs и закоммитьте dist/"
            exit 1
          fi

      - name: Generate version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./dist/version.json').v)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare files
        run: |
          # картинки, которые скрипт кладёт в img/ (карусели Threads), остаются по старому адресу
          if [ -d img ]; then cp -r img dist/img; fi
          touch dist/.nojekyll
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Telegram on success
        if: success()
        run: |
          MSG="✅ Mini App обновлён%0A%0AВерсия: ${{ needs.build.outputs.version }}%0AURL: https://neuvolen.github.io/bs-app/"
          curl -sS "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "disable_web_page_preview=true" || true

      - name: Notify Telegram on failure
        if: failure()
        run: |
          MSG="❌ Деплой Mini App упал%0A%0AЛоги: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "disable_web_page_preview=true" || true
